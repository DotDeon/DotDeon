<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Deon Roos, software engineer, Pretoria, South Africa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0">
      <stop offset="0%" stop-color="#e2e2e2"/>
      <stop offset="42%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e2e2"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-420,0; 1240,0; 1240,0" keyTimes="0; 0.5; 1" dur="7s"
        calcMode="spline" keySplines="0.45 0 0.2 1; 0 0 1 1" repeatCount="indefinite"/>
    </linearGradient>

    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 62px; font-weight: 700; fill: url(#shine); letter-spacing: -1px;
      }
      .c {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 15px; fill: #b8b8b8;
        animation: wave 3.6s ease-in-out infinite;
      }
      @keyframes wave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
      .c0 { animation-delay: 0.0s; }
      .c1 { animation-delay: 0.045s; }
      .c2 { animation-delay: 0.09s; }
      .c3 { animation-delay: 0.135s; }
      .c4 { animation-delay: 0.18s; }
      .c5 { animation-delay: 0.225s; }
      .c6 { animation-delay: 0.27s; }
      .c7 { animation-delay: 0.315s; }
      .c9 { animation-delay: 0.405s; }
      .c10 { animation-delay: 0.45s; }
      .c11 { animation-delay: 0.495s; }
      .c12 { animation-delay: 0.54s; }
      .c13 { animation-delay: 0.585s; }
      .c14 { animation-delay: 0.63s; }
      .c15 { animation-delay: 0.675s; }
      .c16 { animation-delay: 0.72s; }
      .c18 { animation-delay: 0.81s; }
      .c20 { animation-delay: 0.9s; }
      .c21 { animation-delay: 0.945s; }
      .c22 { animation-delay: 0.99s; }
      .c23 { animation-delay: 1.035s; }
      .c24 { animation-delay: 1.08s; }
      .c25 { animation-delay: 1.125s; }
      .c26 { animation-delay: 1.17s; }
      .c27 { animation-delay: 1.215s; }
      .c28 { animation-delay: 1.26s; }
      .c30 { animation-delay: 1.35s; }
      .c31 { animation-delay: 1.395s; }
      .c32 { animation-delay: 1.44s; }
      .c33 { animation-delay: 1.485s; }
      .c34 { animation-delay: 1.53s; }
      .c36 { animation-delay: 1.62s; }
      .c37 { animation-delay: 1.665s; }
      .c38 { animation-delay: 1.71s; }
      .c39 { animation-delay: 1.755s; }
      .c40 { animation-delay: 1.8s; }
      .c41 { animation-delay: 1.845s; }
      .rise { animation: rise 1.1s cubic-bezier(.2,.7,.3,1) both; }
      .rise2 { animation: rise 1.1s cubic-bezier(.2,.7,.3,1) 0.35s both; }
      @keyframes rise { from { transform: translateY(16px); } to { transform: translateY(0); } }
      .wave1 { animation: drift 14s linear infinite; }
      .wave2 { animation: drift 9s linear infinite reverse; }
      @keyframes drift { to { transform: translateX(-240px); } }
      @media (prefers-reduced-motion: reduce) {
        .c, .rise, .rise2, .wave1, .wave2 { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <g class="wave2" opacity="0.30">
    <path fill="url(#fade)" d="M0,168 q60,-22 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 V200 H0 Z"/>
  </g>
  <g class="wave1" opacity="0.55">
    <path fill="#000000" opacity="0.45" d="M0,180 q60,-26 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 V200 H0 Z"/>
  </g>

  <g class="rise">
    <text class="name" x="600" y="98" text-anchor="middle">Deon Roos</text>
  </g>
  <g class="rise2">
    <text class="c c0" x="380.25" y="132">S</text>
    <text class="c c1" x="390.75" y="132">O</text>
    <text class="c c2" x="401.25" y="132">F</text>
    <text class="c c3" x="411.75" y="132">T</text>
    <text class="c c4" x="422.25" y="132">W</text>
    <text class="c c5" x="432.75" y="132">A</text>
    <text class="c c6" x="443.25" y="132">R</text>
    <text class="c c7" x="453.75" y="132">E</text>
    <text class="c c9" x="474.75" y="132">E</text>
    <text class="c c10" x="485.25" y="132">N</text>
    <text class="c c11" x="495.75" y="132">G</text>
    <text class="c c12" x="506.25" y="132">I</text>
    <text class="c c13" x="516.75" y="132">N</text>
    <text class="c c14" x="527.25" y="132">E</text>
    <text class="c c15" x="537.75" y="132">E</text>
    <text class="c c16" x="548.25" y="132">R</text>
    <text class="c c18" x="569.25" y="132">&#183;</text>
    <text class="c c20" x="590.25" y="132">P</text>
    <text class="c c21" x="600.75" y="132">R</text>
    <text class="c c22" x="611.25" y="132">E</text>
    <text class="c c23" x="621.75" y="132">T</text>
    <text class="c c24" x="632.25" y="132">O</text>
    <text class="c c25" x="642.75" y="132">R</text>
    <text class="c c26" x="653.25" y="132">I</text>
    <text class="c c27" x="663.75" y="132">A</text>
    <text class="c c28" x="674.25" y="132">,</text>
    <text class="c c30" x="695.25" y="132">S</text>
    <text class="c c31" x="705.75" y="132">O</text>
    <text class="c c32" x="716.25" y="132">U</text>
    <text class="c c33" x="726.75" y="132">T</text>
    <text class="c c34" x="737.25" y="132">H</text>
    <text class="c c36" x="758.25" y="132">A</text>
    <text class="c c37" x="768.75" y="132">F</text>
    <text class="c c38" x="779.25" y="132">R</text>
    <text class="c c39" x="789.75" y="132">I</text>
    <text class="c c40" x="800.25" y="132">C</text>
    <text class="c c41" x="810.75" y="132">A</text>
  </g>
</svg>
