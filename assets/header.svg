<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Deon Roos, software engineer, Pretoria, South Africa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 62px; font-weight: 700; fill: #ffffff; letter-spacing: -1px;
      }
      .desc {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 15px; fill: #b8b8b8; letter-spacing: 1.5px;
      }
      .fade { animation: rise 1.1s cubic-bezier(.2,.7,.3,1) both; }
      .fade2 { animation: rise 1.1s cubic-bezier(.2,.7,.3,1) 0.35s both; }
      @keyframes rise { from { transform: translateY(16px); } to { transform: translateY(0); } }
      .wave { animation: drift 14s linear infinite; }
      .wave2 { animation: drift 9s linear infinite reverse; }
      @keyframes drift { to { transform: translateX(-240px); } }
      @media (prefers-reduced-motion: reduce) {
        .fade, .fade2 { animation: none; }
        .wave, .wave2 { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <g class="wave2" opacity="0.30">
    <path fill="url(#fade)" d="M0,168 q60,-22 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 V200 H0 Z"/>
  </g>
  <g class="wave" opacity="0.55">
    <path fill="#000000" opacity="0.45" d="M0,180 q60,-26 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0 V200 H0 Z"/>
  </g>

  <text class="name fade" x="600" y="98" text-anchor="middle">Deon Roos</text>
  <text class="desc fade2" x="600" y="132" text-anchor="middle">SOFTWARE ENGINEER &#183; PRETORIA, SOUTH AFRICA</text>
</svg>
