<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#585858"/>
      <stop offset="40%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <style>
      .wave { animation: drift 14s linear infinite; }
      .wave2 { animation: drift 9s linear infinite reverse; }
      @keyframes drift { to { transform: translateX(-240px); } }
      @media (prefers-reduced-motion: reduce) { .wave, .wave2 { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="110" fill="url(#bg)"/>
  <g class="wave2" opacity="0.30">
