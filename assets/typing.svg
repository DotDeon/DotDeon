<svg xmlns="http://www.w3.org/2000/svg" width="760" height="56" viewBox="0 0 760 56" role="img" aria-label="I build web platforms, iOS apps, and the backends under them. Next.js · Convex · Swift · Expo · AI. Most of it ships to real customers. Most of it lives in private repositories">
  <style>
